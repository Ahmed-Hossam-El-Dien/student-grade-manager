{% extends "base.html" %}

{% block title %}Edit Course{% endblock %}

{% block content %}
<div class="card card--form">
    <h1>Edit Course</h1>

    {% if error %}
    <p class="alert">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/courses/edit/{{ course[0] }}" class="form">
        <label for="course_name">Course Name</label>
        <input type="text" id="course_name" name="course_name" value="{{ course[1] }}" required>

        <label for="course_code">Course Code</label>
        <input type="text" id="course_code" name="course_code" value="{{ course[2] }}" required>

        <button type="submit" class="btn btn--primary">Save Changes</button>
    </form>

    <a href="/courses" class="back-link">Back to Courses</a>
</div>
{% endblock %}
