{% extends "base.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}
<div class="card card--form">
    <h1>Add a New Student</h1>

    {% if error %}
    <p class="alert">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/add" class="form">
        <label for="student_id">Student ID</label>
        <input type="number" id="student_id" name="student_id" required min="1">

        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" required>

        <label for="age">Age</label>
        <input type="number" id="age" name="age" required min="1">

        <label for="grade">Grade</label>
        <input type="number" id="grade" name="grade" required min="0" max="100" step="0.1">

        <label for="email">Login Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Login Password</label>
        <input type="password" id="password" name="password" required minlength="6">

        <button type="submit" class="btn btn--primary">Add Student</button>
    </form>

    <a href="/students" class="back-link">Back to Student List</a>
</div>
{% endblock %}
