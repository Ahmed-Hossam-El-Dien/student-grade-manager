{% extends "base.html" %}

{% block title %}Add Teacher{% endblock %}

{% block content %}
<div class="card card--form">
    <h1>Add a New Teacher</h1>

    {% if error %}
    <p class="alert">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/teachers/add" class="form">
        <label for="teacher_id">Teacher ID</label>
        <input type="text" id="teacher_id" name="teacher_id" required>

        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" required>

        <label for="email">Login Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Login Password</label>
        <input type="password" id="password" name="password" required minlength="6">

        <button type="submit" class="btn btn--primary">Add Teacher</button>
    </form>

    <a href="/teachers" class="back-link">Back to Teachers</a>
</div>
{% endblock %}
