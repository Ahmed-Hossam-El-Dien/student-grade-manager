<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
</head>
<body>
    <h1>Student List</h1>
 
    <table border="1" cellpadding="6" cellspacing="0">
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Age</th>
            <th>Grade</th>
            <th>Actions</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td><a href="/edit/{{ student[0] }}">Edit</a></td>
        </tr>
        {% else %}
        <tr>
            <td colspan="5">No students yet.</td>
        </tr>
        {% endfor %}
    </table>
 
    <br>
    <a href="/add">Add New Student</a>
</body>
</html>
