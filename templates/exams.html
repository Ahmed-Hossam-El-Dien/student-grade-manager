{% extends "base.html" %}

{% block title %}Exams{% endblock %}

{% block content %}
<div class="card">
    <div class="card__header">
        <h1>Exams</h1>
    </div>

    {% if error %}
    <p class="alert">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/exams" class="search-bar">
        <input type="text" name="exam_name" placeholder="New exam name (e.g. Midterm)" required>
        <button type="submit" class="btn btn--primary">Add Exam</button>
    </form>

    <table class="student-table">
        <tr>
            <th>ID</th>
            <th>Exam Name</th>
        </tr>
        {% for e in exams %}
        <tr>
            <td>{{ e[0] }}</td>
            <td>{{ e[1] }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="2" class="empty-row">No exams yet.</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
