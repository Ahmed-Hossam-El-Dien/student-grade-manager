<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>
<body>
    <h1>Edit Student</h1>

    <form method="POST" action="/edit/{{ student[0] }}">
        <label for="full_name">Full Name:</label><br>
        <input type="text" id="full_name" name="full_name" value="{{ student[1] }}" required><br><br>

        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" value="{{ student[2] }}" required min="1"><br><br>

        <label for="grade">Grade:</label><br>
        <input type="number" id="grade" name="grade" value="{{ student[3] }}" required min="0" max="100" step="0.1"><br><br>

        <button type="submit">Save Changes</button>
    </form>

    <br>
    <a href="/students">Back to Student List</a>
</body>
</html>
