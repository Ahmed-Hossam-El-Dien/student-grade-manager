{% extends "base.html" %}

{% block title %}Edit Student{% endblock %}

{% block content %}
<div class="card card--form">
    <h1>Edit Student</h1>

    {% if error %}
    <p class="alert">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/edit/{{ student[0] }}" class="form">
        <label for="student_id">Student ID</label>
        <input type="text" id="student_id" name="student_id" value="{{ student[1] }}" required>

        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" value="{{ student[2] }}" required>

        <label for="age">Age</label>
        <input type="number" id="age" name="age" value="{{ student[3] }}" required min="1">

        <label for="grade">Grade</label>
        <input type="number" id="grade" name="grade" value="{{ student[4] }}" required min="0" max="100" step="0.1">

        <button type="submit" class="btn btn--primary">Save Changes</button>
    </form>

    <a href="/students" class="back-link">Back to Student List</a>
</div>
{% endblock %}
